<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e37">
  <title>메이커 안전미션</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <button class="brand" data-action="home" aria-label="메이커 안전미션 시작 화면">
      <span class="brand-symbol" aria-hidden="true">✦</span><span>메이커 <strong>안전미션</strong></span>
    </button>
    <span class="header-note">안전하게 만드는 첫걸음</span>
    <button class="quiet" data-action="about">사용 안내</button>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="site-footer"><span>기술실 · 무한상상실 · 메이커실 · 융합형 교육실</span><span>함께 확인하고, 안전하게 시작해요.</span></footer>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <dialog id="info-dialog"><div id="dialog-body"></div><button class="primary" data-action="close-dialog">확인</button></dialog>
  <dialog id="reset-dialog"><h2>시작 화면으로 이동할까요?</h2><p>진행 중인 미션은 저장됩니다. 시작 화면에서 이어 할 수 있어요.</p><div class="button-row"><button class="secondary" data-action="close-reset">계속하기</button><button class="primary" data-action="confirm-home">시작 화면으로</button></div></dialog>
</body>
</html>
